<!DOCTYPE html>
<html>
<head>
    <title>Cadastro de Planta</title>
</head>
<body>
    <h2>Cadastrar Planta</h2>

    <form action="/cadastrarPlanta" method="post">
        <label>Nome:</label>
        <input type="text" name="nome">

        <label>Tipo:</label>
        <input type="text" name="tipo">

        <label>Tempo de Crescimento:</label>
        <input type="number" name="tempo">

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
